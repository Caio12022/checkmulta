name: TESTE - Preview de imagem do blog (temporario)

# Workflow temporario, so pra gerar 2-3 imagens de amostra e comitar
# NO PROPRIO BRANCH em que ele roda (nunca na main - o commit vai pro
# ref que foi passado no dispatch). Apagar depois de aprovado o estilo -
# ver robo/testar-imagem.ts.
"on":
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gerar-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      - name: Preparar o Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar dependencias
        working-directory: robo
        run: npm install

      - name: Gerar imagens de amostra
        working-directory: robo
        run: npx tsx testar-imagem.ts
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Comitar amostras neste branch (nunca na main)
        working-directory: robo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add preview
          git commit -m "Preview de imagens de teste (temporario)" || echo "nada para comitar"
          git push origin HEAD:${{ github.ref_name }}
