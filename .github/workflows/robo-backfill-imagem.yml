name: Robo de Backfill de Imagem

# 21h UTC: depois de todos os robos de artigo (3h/6h/9h/12h/13h/15h) e do
# auditor (18h), nunca no mesmo horario de outro robo. Da capa a artigos
# antigos sem imagem, sorteando entre as 5 verticais - ver robo-backfill.ts.
"on":
  workflow_dispatch:
    inputs:
      quantidade:
        description: "Quantos artigos sortear hoje (1 a 10, padrao 6)"
        required: false
        type: string
  schedule:
    - cron: "0 21 * * *"

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      - name: Preparar o Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar dependencias
        working-directory: robo-auditor
        run: npm install

      - name: Rodar o backfill
        working-directory: robo-auditor
        run: npx tsx robo-backfill.ts
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          QUANTIDADE: ${{ inputs.quantidade }}
