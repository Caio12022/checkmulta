name: Gerar imagem manual

# Coloca imagem de capa em artigo JA publicado, sem esperar o robo.
# Serve pra testar na hora e pro backfill dos artigos antigos.
#
# A imagem so vai pro ar se passar na auditoria - artigo publicado nao
# pode piorar. Ver robo-auditor/gerar-manual.ts.
"on":
  workflow_dispatch:
    inputs:
      vertical:
        description: "Qual blog"
        required: true
        type: choice
        options:
          - transito
          - procon
          - vigilancia
          - energia
          - ibama
      slug:
        description: "Slug do artigo (vazio = pega os mais recentes SEM imagem)"
        required: false
        type: string
      quantidade:
        description: "Quantos artigos, quando o slug fica vazio (1 a 10)"
        required: false
        default: "1"
        type: string

permissions:
  contents: write

jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      - name: Preparar o Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar dependencias
        working-directory: robo-auditor
        run: npm install

      - name: Gerar e publicar
        working-directory: robo-auditor
        run: npx tsx gerar-manual.ts
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          VERTICAL: ${{ inputs.vertical }}
          SLUG: ${{ inputs.slug }}
          QUANTIDADE: ${{ inputs.quantidade }}
