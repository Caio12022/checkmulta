name: Bateria de testes de analise

# Roda apenas sob comando. A bateria consome chamadas de IA (uma por caso),
# entao nao faz sentido disparar a cada push.
"on":
  workflow_dispatch:
    inputs:
      vertical:
        description: "Vertical a testar (ibama, transito, procon, vigilancia, energia). Vazio roda todas."
        required: false
        default: ""
      repeticoes:
        description: "Quantas vezes rodar cada caso. 2 e o padrao: o modelo varia entre execucoes, e uma rodada so nao enxerga isso."
        required: false
        default: "2"
      etapa:
        description: "O que testar: analise (a gratuita), defesa (a paga) ou ambas. Vazio roda ambas."
        required: false
        default: ""
        type: choice
        options: ["", "analise", "defesa", "ambas"]

jobs:
  # Testes de unidade do validador. Nao chamam IA: rodam em segundos, sao
  # deterministicos e cobrem os DOIS lados de cada trava (pegou o ruim E
  # liberou o legitimo). Rodam antes da bateria porque uma falha aqui e sempre
  # defeito, nunca variacao do modelo — e nao gasta cota para descobrir isso.
  unidade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
      - run: npm install
      - run: npm run build
      - run: node testes/unidade.mjs

  # As cinco verticais sao independentes entre si, mas rodavam em fila: 92
  # chamadas sequenciais ao Gemini passavam de 50 minutos em dia de pico de
  # demanda. Bateria lenta e bateria que a gente evita rodar, e o valor dela
  # vem de rodar sempre. Aqui a lista de verticais vira matriz.
  escolher:
    runs-on: ubuntu-latest
    outputs:
      verticais: ${{ steps.montar.outputs.verticais }}
    steps:
      - name: Montar a lista de verticais
        id: montar
        env:
          ALVO: ${{ github.event.inputs.vertical }}
        run: |
          alvo=$(echo "$ALVO" | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]')
          if [ -z "$alvo" ]; then
            lista='["ibama","transito","procon","vigilancia","energia"]'
          else
            lista="[\"$alvo\"]"
          fi
          echo "verticais=$lista" >> "$GITHUB_OUTPUT"
          echo "Vai rodar: $lista"

  bateria:
    needs: [escolher, unidade]
    runs-on: ubuntu-latest
    strategy:
      # Uma vertical vermelha nao pode cancelar as outras: o que interessa e o
      # quadro completo, nao a primeira falha.
      fail-fast: false
      matrix:
        vertical: ${{ fromJSON(needs.escolher.outputs.verticais) }}
    name: bateria (${{ matrix.vertical }})
    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v5

      - name: Preparar o Node
        uses: actions/setup-node@v5
        with:
          node-version: "20"

      - name: Instalar dependencias
        run: npm install

      # Build de producao: a bateria roda contra o mesmo caminho de codigo
      # que atende o site no ar, e nao contra o servidor de desenvolvimento.
      - name: Compilar
        run: npm run build

      - name: Subir o servidor
        run: |
          nohup npm start > /tmp/servidor.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf -o /dev/null http://localhost:3000/; then
              echo "Servidor no ar."
              exit 0
            fi
            sleep 2
          done
          echo "Servidor nao subiu a tempo. Log:"
          cat /tmp/servidor.log
          exit 1
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NODE_ENV: production

      # A analise cobre /api/analyze-* (a parte gratuita) e a defesa cobre
      # /api/generate-defense-* (a paga). Sao baterias separadas porque a
      # entrada e diferente: uma recebe documento, a outra recebe a analise
      # ja auditada.
      - name: Rodar a bateria de analise
        if: ${{ github.event.inputs.etapa == '' || github.event.inputs.etapa == 'analise' || github.event.inputs.etapa == 'ambas' }}
        run: node testes/rodar.mjs ${{ matrix.vertical }}
        env:
          REPETICOES: ${{ github.event.inputs.repeticoes }}

      - name: Rodar a bateria de defesa
        if: ${{ github.event.inputs.etapa == '' || github.event.inputs.etapa == 'defesa' || github.event.inputs.etapa == 'ambas' }}
        run: node testes/rodar-defesa.mjs ${{ matrix.vertical }}
        env:
          REPETICOES: ${{ github.event.inputs.repeticoes }}
          DEBUG_CITACAO: "1"

      - name: Log do servidor (quando algo falha)
        if: failure()
        run: tail -100 /tmp/servidor.log

  # Um lugar so para olhar o resultado, em vez de abrir as cinco matrizes.
  resultado:
    needs: [unidade, bateria]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Consolidar
        run: |
          echo "Unidade: ${{ needs.unidade.result }}"
          echo "Bateria: ${{ needs.bateria.result }}"
          [ "${{ needs.unidade.result }}" = "success" ] && [ "${{ needs.bateria.result }}" = "success" ]
